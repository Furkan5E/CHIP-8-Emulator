name: Release

# push a version tag (e.g. git tag v2.0.0 && git push origin v2.0.0) to build every
# platform and publish a GitHub release with the packaged executables attached.
# running it manually from the Actions tab only builds and packages (no release)
on:
  push:
    tags: [ "v*.*.*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows
            exe: build/Release/chip8.exe
            archive: zip
          - os: ubuntu-latest
            platform: linux
            exe: build/chip8
            archive: tar.gz
          - os: macos-latest
            platform: macos
            exe: build/chip8
            archive: tar.gz

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release

    # folder name is e.g. CHIP8-v2.0.0-windows, manual runs use the branch name instead of a tag
    - name: Package
      shell: bash
      run: |
        name="CHIP8-${GITHUB_REF_NAME//\//-}-${{ matrix.platform }}"
        mkdir -p "dist/$name"
        cp "${{ matrix.exe }}" README.md LICENSE "dist/$name/"
        cd dist
        if [ "${{ matrix.archive }}" = "zip" ]; then
          cmake -E tar cf "$name.zip" --format=zip "$name"
        else
          tar czf "$name.tar.gz" "$name"
        fi
        echo "ARCHIVE=dist/$name.${{ matrix.archive }}" >> "$GITHUB_ENV"

    - name: Upload package
      uses: actions/upload-artifact@v4
      with:
        name: package-${{ matrix.platform }}
        path: ${{ env.ARCHIVE }}
        if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
    - name: Download packages
      uses: actions/download-artifact@v4
      with:
        pattern: package-*
        path: dist
        merge-multiple: true

    - name: Create release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "$GITHUB_REF_NAME" dist/* \
          --repo "$GITHUB_REPOSITORY" \
          --title "$GITHUB_REF_NAME" \
          --generate-notes
