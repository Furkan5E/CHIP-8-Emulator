name: CMake Build CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    # reuse the SDL2 download and build between runs, only rebuilt when CMakeLists.txt changes
    - name: Cache build directory
      uses: actions/cache@v4
      with:
        path: ${{github.workspace}}/build
        key: build-${{ matrix.os }}-${{ hashFiles('CMakeLists.txt') }}

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config Release

    # single config generators put the binary in build/, multi config (Visual Studio) in build/Release/
    - name: Upload executable
      uses: actions/upload-artifact@v4
      with:
        name: chip8-${{ matrix.os }}
        path: |
          ${{github.workspace}}/build/chip8
          ${{github.workspace}}/build/Release/chip8.exe
        if-no-files-found: error
